# Every push to main is tagged v0.1.<run number>, built for every platform and
# attached to a GitHub release. Pushing a tag like v0.2.0 by hand also works.
# install.sh / install.ps1 download from releases/latest, so users get the newest.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Pick the tag and create a draft release (no-op if it exists)
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; else tag="v0.1.$GITHUB_RUN_NUMBER"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes --draft || true

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          # 22.04 = glibc 2.35, so binaries also run on Raspberry Pi OS / Debian 12.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: NASM (aws-lc on Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package and upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          cd target/${{ matrix.target }}/release
          if [ "$RUNNER_OS" = "Windows" ]; then
            asset=poker-${{ matrix.target }}.zip
            7z a "$asset" poker.exe
          else
            asset=poker-${{ matrix.target }}.tar.gz
            tar -czf "$asset" poker
          fi
          gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --clobber

  # Only now does the release become "latest", so installers never see a half-built one.
  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.create-release.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
