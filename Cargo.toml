[package]
name = "pokertui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Terminal poker over public pub/sub relays, no server required"

[[bin]]
name = "poker"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-tungstenite = { version = "0.29", default-features = false, features = ["tokio-runtime", "tokio-rustls-native-certs", "handshake", "futures-03-sink"] }
base64 = "0.22"
chacha20poly1305 = "0.11"
curve25519-dalek = "5"
clap = { version = "4.6", features = ["derive", "env"] }
directories = "6"
ed25519-dalek = "3"
getrandom = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hkdf = "0.13"
rand_chacha = "0.10"
ratatui = "0.30"
rumqttc = { version = "0.25", features = ["websocket"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
x25519-dalek = { version = "3", features = ["static_secrets"] }
zeroize = "1"

[dev-dependencies]
rand_chacha = "0.10"

[profile.release]
lto = "thin"
strip = true
